<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק הקלפים המשפחתי בלייב</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --accent: #fd79a8;
            --success: #00b894;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #2d3436;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            margin: 15px 0;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 3px solid var(--secondary);
        }

        .card-target {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .card-text {
            font-size: 1.25rem;
            line-height: 1.5;
        }

        input[type="text"] {
            width: 80%;
            padding: 12px;
            border: 2px solid var(--secondary);
            border-radius: 12px;
            font-size: 1rem;
            margin: 6px 0;
            outline: none;
            text-align: center;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin: 6px 4px;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-success { background-color: var(--success); }
        .btn-accent { background-color: var(--accent); }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }

        .player-card {
            background: white;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
        }

        .player-card.active {
            border-color: var(--primary);
            background-color: #f0edff;
        }

        .player-name { font-weight: bold; }
        .player-score { font-size: 0.85rem; color: #636e72; margin-top: 4px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎲 המשחק המשפחתי בלייב</h1>

    <!-- מסך כניסה -->
    <div id="login-screen">
        <h3>התחברות למשחק</h3>
        <input type="text" id="room-input" placeholder="קוד חדר (באנגלית/מספרים)">
        <input type="text" id="name-input" placeholder="השם שלך">
        <br>
        <button onclick="initGame(true)">פתח חדר חדש (מנהל)</button>
        <button class="btn-accent" onclick="initGame(false)">התחבר לחדר קיים</button>
    </div>

    <!-- מסך המשחק -->
    <div id="game-screen" class="hidden">
        <div>קוד חדר: <b id="display-room"></b></div>
        <div id="status" style="font-size:0.85rem; color:#888; margin-top:4px;">מתווסף לחדר...</div>
        
        <h3>👥 משתתפים:</h3>
        <div class="players-grid" id="players-list"></div>

        <div class="card" id="main-card">
            <div class="card-target" id="card-target">ממתינים לשחקנים...</div>
            <div class="card-text" id="card-text">לחצו "הרם קלף" כשיש לפחות 2 שחקנים בחדר.</div>
        </div>

        <div id="controls">
            <button class="btn-accent" onclick="drawCard()">🃏 הרם קלף חדש</button>
            <div id="verify-area" class="hidden" style="margin-top: 10px;">
                <button class="btn-success" onclick="approveTask()">✅ אישור משימה (+1 נקודה)</button>
            </div>
        </div>
    </div>
</div>

<script>
    let peer = null;
    let connections = [];
    let hostConn = null;
    let isHost = false;
    let myName = "";
    let roomCode = "";

    let gameState = {
        players: {}, // { name: { score: 0 } }
        card: null
    };

    const questions = [
        "אם היית יכול להחליף תפקידים עם {target} ליום אחד, מה הדבר הראשון שהיית עושה?",
        "מה המאכל ש-{target} הכי אוהב/ת לאכול לדעתך?",
        "תעשה חיקוי מצחיק של {target} במשך 15 שניות!",
        "תן מחמאה מכל הלב ל-{target}.",
        "תמציא לחיצת יד סודית ומגניבה יחד עם {target}.",
        "ספר בדיחה! אם {target} צוחק/ת - מגיע לך ניקוד!",
        "מה הדבר הכי מיוחד או יפה ב-{target}?",
        "עשה פרצוף מצחיק עד ש-{target} מחייך/ת!",
        "תאר את {target} בשלוש מילים בלבד.",
        "מה הדבר שהכי מצחיק אותך ב-{target}?",
        "אם היית צורך לבשל ארוחה ל-{target}, מה היית מכין?",
        "עשה עיסוי כתפיים קצר של 10 שניות ל-{target}.",
        "רוץ מסביב ל-{target} פעמיים ותגיד משהו מצחיק!",
        "נסה לחקות את הצחוק של {target}.",
        "תן כיף באוויר (High Five) מיוחד ל-{target}!"
    ];

    function initGame(hostFlag) {
        isHost = hostFlag;
        roomCode = document.getElementById('room-input').value.trim().toLowerCase();
        myName = document.getElementById('name-input').value.trim();

        if (!roomCode || !myName) {
            alert("נא להזין קוד חדר ושם!");
            return;
        }

        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('display-room').innerText = roomCode;

        if (isHost) {
            // מנהל המשחק יוצר Peer לפי קוד החדר
            peer = new Peer('fam-game-' + roomCode);
            peer.on('open', () => {
                document.getElementById('status').innerText = "מחובר כמנהל החדר ✅";
                gameState.players[myName] = { score: 0 };
                broadcastState();
            });

            peer.on('connection', (conn) => {
                connections.push(conn);
                conn.on('data', (data) => handleData(data, conn));
            });

            peer.on('error', (err) => {
                alert("קוד חדר זה תפוס או שקיימת שגיאה. נסה קוד אחר.");
            });
        } else {
            // משתתף רגיל מתחבר למנהל
            peer = new Peer();
            peer.on('open', () => {
                document.getElementById('status').innerText = "מתחבר למנהל...";
                hostConn = peer.connect('fam-game-' + roomCode);
                
                hostConn.on('open', () => {
                    document.getElementById('status').innerText = "מחובר לחדר ✅";
                    hostConn.send({ type: 'JOIN', name: myName });
                });

                hostConn.on('data', (data) => handleData(data));
            });
        }
    }

    function handleData(data, conn = null) {
        if (isHost) {
            if (data.type === 'JOIN') {
                gameState.players[data.name] = { score: 0 };
                broadcastState();
            } else if (data.type === 'DRAW') {
                processDrawCard();
            } else if (data.type === 'APPROVE') {
                processApprove();
            }
        } else {
            if (data.type === 'STATE') {
                gameState = data.state;
                renderUI();
            }
        }
    }

    function broadcastState() {
        renderUI();
        connections.forEach(c => {
            if (c.open) c.send({ type: 'STATE', state: gameState });
        });
    }

    function renderUI() {
        const list = document.getElementById('players-list');
        list.innerHTML = '';
        
        Object.keys(gameState.players).forEach(pName => {
            const p = gameState.players[pName];
            const isTurn = gameState.card && gameState.card.activePlayer === pName;
            list.innerHTML += `
                <div class="player-card ${isTurn ? 'active' : ''}">
                    <div class="player-name">${pName} ${isTurn ? '⭐' : ''}</div>
                    <div class="player-score">🏆 ${p.score} נק'</div>
                </div>
            `;
        });

        if (gameState.card) {
            document.getElementById('card-target').innerText = `תור: ${gameState.card.activePlayer} ⬅️ מול: ${gameState.card.targetPlayer}`;
            document.getElementById('card-text').innerHTML = gameState.card.text;

            const verifyArea = document.getElementById('verify-area');
            if (myName === gameState.card.targetPlayer && !gameState.card.approved) {
                verifyArea.classList.remove('hidden');
            } else {
                verifyArea.classList.add('hidden');
            }
        }
    }

    function drawCard() {
        if (isHost) {
            processDrawCard();
        } else if (hostConn && hostConn.open) {
            hostConn.send({ type: 'DRAW' });
        }
    }

    function processDrawCard() {
        const pNames = Object.keys(gameState.players);
        if (pNames.length < 2) {
            alert("צריך לפחות 2 משתתפים בחדר!");
            return;
        }

        const activePlayer = pNames[Math.floor(Math.random() * pNames.length)];
        let targetPlayer = pNames[Math.floor(Math.random() * pNames.length)];
        while (targetPlayer === activePlayer) {
            targetPlayer = pNames[Math.floor(Math.random() * pNames.length)];
        }

        const randomQ = questions[Math.floor(Math.random() * questions.length)];
        const formattedQ = randomQ.replace(/{target}/g, `<b>${targetPlayer}</b>`);

        gameState.card = {
            activePlayer,
            targetPlayer,
            text: formattedQ,
            approved: false
        };

        broadcastState();
    }

    function approveTask() {
        if (isHost) {
            processApprove();
        } else if (hostConn && hostConn.open) {
            hostConn.send({ type: 'APPROVE' });
        }
    }

    function processApprove() {
        if (!gameState.card) return;
        const active = gameState.card.activePlayer;
        if (gameState.players[active]) {
            gameState.players[active].score += 1;
        }
        gameState.card.approved = true;
        broadcastState();
    }
</script>
</body>
</html>
