<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק הקלפים המשפחתי - בלייב</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --accent: #fd79a8;
            --success: #00b894;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #2d3436;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            margin: 15px 0;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 3px solid var(--secondary);
        }

        .card-target {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .card-text {
            font-size: 1.25rem;
            line-height: 1.5;
        }

        input[type="text"] {
            width: 80%;
            padding: 12px;
            border: 2px solid var(--secondary);
            border-radius: 12px;
            font-size: 1rem;
            margin: 6px 0;
            outline: none;
            text-align: center;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin: 6px 4px;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-success {
            background-color: var(--success);
        }

        .btn-accent {
            background-color: var(--accent);
        }

        /* כרטיסי משתתפים */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }

        .player-card {
            background: white;
            padding: 12px;
            border-radius: 15px;
            border: 2px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .player-card.active-turn {
            border-color: var(--primary);
            background-color: #f0edff;
            box-shadow: 0 0 10px rgba(108, 92, 231, 0.3);
        }

        .player-name {
            font-weight: bold;
            font-size: 1rem;
        }

        .player-score {
            font-size: 0.9rem;
            color: #636e72;
            margin-top: 4px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎲 המשחק המשפחתי בלייב</h1>

    <!-- מסך כניסה וחדר -->
    <div id="login-screen">
        <h3>התחברות למשחק</h3>
        <input type="text" id="room-input" placeholder="קוד חדר (למשל: 1234)">
        <input type="text" id="name-input" placeholder="השם שלך">
        <br>
        <button onclick="joinGame()">הכנס למשחק</button>
    </div>

    <!-- מסך המשחק -->
    <div id="game-screen" class="hidden">
        <div>קוד חדר: <b id="display-room"></b></div>
        
        <!-- כרטיסי משתתפים -->
        <h3>👥 משתתפים וניקוד:</h3>
        <div class="players-grid" id="players-list"></div>

        <!-- קלף המשימה -->
        <div class="card" id="main-card">
            <div class="card-target" id="card-target">ממתינים להתחלת המשחק...</div>
            <div class="card-text" id="card-text">לחצו על "הרם קלף" כדי להתחיל!</div>
        </div>

        <!-- כפתורי פעולה -->
        <div id="controls">
            <button class="btn-accent" onclick="drawCard()">🃏 הרם קלף חדש</button>
            <div id="verify-area" class="hidden" style="margin-top: 10px;">
                <button class="btn-success" onclick="approveTask()">✅ אישור משימה (+1 נקודה)</button>
            </div>
        </div>
    </div>
</div>

<script>
    // הגדרת Firebase (מסד נתונים ציבורי חינמי)
    const firebaseConfig = {
        databaseURL: "https://family-game-default-rtdb.europe-west1.firebasedatabase.app/"
    };
    
    // במידה והשרת הציבורי אינו זמין, משתמשים בגיבוי
    try {
        firebase.initializeApp(firebaseConfig);
    } catch(e) {
        console.log("Firebase init");
    }
    const db = firebase.database();

    let roomCode = "";
    let myName = "";
    let currentGameState = {};

    const questions = [
        "אם היית יכול להחליף תפקידים עם {target} ליום אחד, מה הדבר הראשון שהיית עושה?",
        "מה המאכל ש-{target} הכי אוהב/ת לאכול לדעתך?",
        "תעשה חיקוי מצחיק של {target} במשך 15 שניות!",
        "תן מחמאה מכל הלב ל-{target}.",
        "תמציא לחיצת יד סודית ומגניבה יחד עם {target}.",
        "ספר בדיחה! אם {target} צוחק/ת - מגיע לך ניקוד!",
        "מה הדבר הכי מיוחד או יפה ב-{target}?",
        "עשה פרצוף מצחיק עד ש-{target} מחייך/ת!",
        "תאר את {target} בשלוש מילים בלבד.",
        "מה הדבר שהכי מצחיק אותך ב-{target}?",
        "אם היית צורך לבשל ארוחה ל-{target}, מה היית מכין?",
        "עשה עיסוי כתפיים קצר של 10 שניות ל-{target}.",
        "רוץ מסביב ל-{target} פעמיים ותגיד משהו מצחיק!",
        "נסה לחקות את הצחוק של {target}.",
        "תן כיף באוויר (High Five) מיוחד ל-{target}!"
    ];

    function joinGame() {
        roomCode = document.getElementById('room-input').value.trim();
        myName = document.getElementById('name-input').value.trim();

        if (!roomCode || !myName) {
            alert("נא להזין קוד חדר ושם!");
            return;
        }

        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('display-room').innerText = roomCode;

        // רישום השחקן בחדר
        const playerRef = db.ref(`rooms/${roomCode}/players/${myName}`);
        playerRef.set({
            name: myName,
            score: 0
        });

        // האזנה לשינויים בזמן אמת בחדר
        db.ref(`rooms/${roomCode}`).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                currentGameState = data;
                updateUI(data);
            }
        });
    }

    function updateUI(data) {
        // עדכון כרטיסי שחקנים
        const playersList = document.getElementById('players-list');
        playersList.innerHTML = '';

        if (data.players) {
            Object.values(data.players).forEach(p => {
                const isCurrentTurn = data.currentTurn === p.name;
                const cardHtml = `
                    <div class="player-card ${isCurrentTurn ? 'active-turn' : ''}">
                        <div class="player-name">${p.name} ${isCurrentTurn ? '⭐' : ''}</div>
                        <div class="player-score">🏆 ${p.score || 0} נקודות</div>
                    </div>
                `;
                playersList.innerHTML += cardHtml;
            });
        }

        // עדכון קלף נוכחי
        if (data.card) {
            document.getElementById('card-target').innerText = `תור: ${data.card.activePlayer} ⬅️ מול: ${data.card.targetPlayer}`;
            document.getElementById('card-text').innerHTML = data.card.text;

            // הצגת כפתור וי/אישור רק למי שמיעדים אליו את המשימה
            const verifyArea = document.getElementById('verify-area');
            if (myName === data.card.targetPlayer && !data.card.approved) {
                verifyArea.classList.remove('hidden');
            } else {
                verifyArea.classList.add('hidden');
            }
        }
    }

    function drawCard() {
        if (!currentGameState.players) return;

        const playerNames = Object.keys(currentGameState.players);
        if (playerNames.length < 2) {
            alert("צריך לפחות 2 שחקנים בחדר כדי להתחיל!");
            return;
        }

        // בחירת שחקן פעיל ושחקן מטרה
        const activePlayer = playerNames[Math.floor(Math.random() * playerNames.length)];
        let targetPlayer = playerNames[Math.floor(Math.random() * playerNames.length)];
        while (targetPlayer === activePlayer) {
            targetPlayer = playerNames[Math.floor(Math.random() * playerNames.length)];
        }

        // בחירת שאלה
        const randomQ = questions[Math.floor(Math.random() * questions.length)];
        const formattedQ = randomQ.replace(/{target}/g, `<b>${targetPlayer}</b>`);

        // עדכון ב-Firebase
        db.ref(`rooms/${roomCode}/card`).set({
            activePlayer: activePlayer,
            targetPlayer: targetPlayer,
            text: formattedQ,
            approved: false
        });

        db.ref(`rooms/${roomCode}/currentTurn`).set(activePlayer);
    }

    function approveTask() {
        if (!currentGameState.card) return;

        const activePlayer = currentGameState.card.activePlayer;
        const currentScore = (currentGameState.players[activePlayer]?.score || 0) + 1;

        // העלאת ניקוד לשחקן שביצע
        db.ref(`rooms/${roomCode}/players/${activePlayer}/score`).set(currentScore);
        // סימון שהמשימה אושרה
        db.ref(`rooms/${roomCode}/card/approved`).set(true);

        alert(`כל הכבוד! ${activePlayer} קיבל/ה נקודה!`);
    }
</script>
</body>
</html>
