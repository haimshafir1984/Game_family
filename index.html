<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק הקלפים המשפחתי בלייב</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --accent: #fd79a8;
            --success: #00b894;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #2d3436;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            margin: 15px 0;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 3px solid var(--secondary);
        }

        .card-target {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .card-text {
            font-size: 1.25rem;
            line-height: 1.5;
        }

        input[type="text"] {
            width: 80%;
            padding: 12px;
            border: 2px solid var(--secondary);
            border-radius: 12px;
            font-size: 1rem;
            margin: 6px 0;
            outline: none;
            text-align: center;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin: 6px 4px;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-success { background-color: var(--success); }
        .btn-accent { background-color: var(--accent); }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }

        .player-card {
            background: white;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
        }

        .player-card.active {
            border-color: var(--primary);
            background-color: #f0edff;
        }

        .player-name { font-weight: bold; }
        .player-score { font-size: 0.85rem; color: #636e72; margin-top: 4px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎲 המשחק המשפחתי בלייב</h1>

    <!-- מסך כניסה -->
    <div id="login-screen">
        <h3>התחברות למשחק</h3>
        <input type="text" id="room-input" placeholder="קוד חדר (למשל: 123)">
        <input type="text" id="name-input" placeholder="השם שלך">
        <br>
        <button onclick="joinGame()">הכנס למשחק</button>
    </div>

    <!-- מסך המשחק -->
    <div id="game-screen" class="hidden">
        <div>קוד חדר: <b id="display-room"></b> | שחקן: <b id="display-my-name" style="color:var(--primary);"></b></div>
        
        <h3>👥 משתתפים וניקוד:</h3>
        <div class="players-grid" id="players-list"></div>

        <div class="card" id="main-card">
            <div class="card-target" id="card-target">ממתינים לתחילת המשחק...</div>
            <div class="card-text" id="card-text">לחצו על "הרם קלף" כדי להתחיל!</div>
        </div>

        <div id="controls">
            <button class="btn-accent" onclick="drawCard()">🃏 הרם קלף חדש</button>
            <div id="verify-area" class="hidden" style="margin-top: 10px;">
                <button class="btn-success" onclick="approveTask()">✅ אישור משימה (+1 נקודה)</button>
            </div>
        </div>
    </div>
</div>

<script>
    let myName = "";
    let roomCode = "";
    let channel = null;

    const questions = [
        "אם היית יכול להחליף תפקידים עם {target} ליום אחד, מה הדבר הראשון שהיית עושה?",
        "מה המאכל ש-{target} הכי אוהב/ת לאכול לדעתך?",
        "תעשה חיקוי מצחיק של {target} במשך 15 שניות!",
        "תן מחמאה מכל הלב ל-{target}.",
        "תמציא לחיצת יד סודית ומגניבה יחד עם {target}.",
        "ספר בדיחה! אם {target} צוחק/ת - מגיע לך ניקוד!",
        "מה הדבר הכי מיוחד או יפה ב-{target}?",
        "עשה פרצוף מצחיק עד ש-{target} מחייך/ת!",
        "תאר את {target} בשלוש מילים בלבד.",
        "מה הדבר שהכי מצחיק אותך ב-{target}?",
        "אם היית צריך לבשל ארוחה ל-{target}, מה היית מכין?",
        "עשה עיסוי כתפיים קצר של 10 שניות ל-{target}.",
        "רוץ מסביב ל-{target} פעמיים ותגיד משהו מצחיק!",
        "נסה לחקות את הצחוק של {target}.",
        "תן כיף באוויר (High Five) מיוחד ל-{target}!"
    ];

    function joinGame() {
        roomCode = document.getElementById('room-input').value.trim();
        myName = document.getElementById('name-input').value.trim();

        if (!roomCode || !myName) {
            alert("נא להזין קוד חדר ושם!");
            return;
        }

        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('display-room').innerText = roomCode;
        document.getElementById('display-my-name').innerText = myName;

        // חיבור לערוץ משותף לפי קוד החדר
        channel = new BroadcastChannel('fam_game_room_' + roomCode);
        channel.onmessage = (event) => {
            if (event.data && event.data.type === 'SYNC') {
                updateUILocally(event.data.state);
            }
        };

        // בדיקה אם קיים כבר מצב חדר שמור
        let state = loadState();
        if (!state.players) state.players = {};
        
        // הוספת שחקן חדש או עדכון נוכחות
        if (!state.players[myName]) {
            state.players[myName] = { score: 0 };
        }

        saveAndBroadcast(state);
    }

    function getStorageKey() {
        return 'fam_game_state_' + roomCode;
    }

    function loadState() {
        const data = localStorage.getItem(getStorageKey());
        return data ? JSON.parse(data) : { players: {}, card: null };
    }

    function saveAndBroadcast(state) {
        localStorage.setItem(getStorageKey(), JSON.stringify(state));
        if (channel) {
            channel.postMessage({ type: 'SYNC', state: state });
        }
        updateUILocally(state);
    }

    function updateUILocally(state) {
        // עדכון רשימת השחקנים
        const list = document.getElementById('players-list');
        list.innerHTML = '';

        if (state.players) {
            Object.keys(state.players).forEach(pName => {
                const p = state.players[pName];
                const isTurn = state.card && state.card.activePlayer === pName;
                list.innerHTML += `
                    <div class="player-card ${isTurn ? 'active' : ''}">
                        <div class="player-name">${pName} ${isTurn ? '⭐' : ''}</div>
                        <div class="player-score">🏆 ${p.score || 0} נק'</div>
                    </div>
                `;
            });
        }

        // עדכון הקלף
        if (state.card) {
            document.getElementById('card-target').innerText = `תור: ${state.card.activePlayer} ⬅️ מול: ${state.card.targetPlayer}`;
            document.getElementById('card-text').innerHTML = state.card.text;

            const verifyArea = document.getElementById('verify-area');
            // אם אני השחקן שאליהם כוונה המשימה והיא טרם אושרה
            if (myName === state.card.targetPlayer && !state.card.approved) {
                verifyArea.classList.remove('hidden');
            } else {
                verifyArea.classList.add('hidden');
            }
        }
    }

    function drawCard() {
        let state = loadState();
        const pNames = Object.keys(state.players);
        
        if (pNames.length < 2) {
            alert("צריך לפחות 2 שחקנים שנכנסו לחדר!");
            return;
        }

        const activePlayer = pNames[Math.floor(Math.random() * pNames.length)];
        let targetPlayer = pNames[Math.floor(Math.random() * pNames.length)];
        while (targetPlayer === activePlayer) {
            targetPlayer = pNames[Math.floor(Math.random() * pNames.length)];
        }

        const randomQ = questions[Math.floor(Math.random() * questions.length)];
        const formattedQ = randomQ.replace(/{target}/g, `<b>${targetPlayer}</b>`);

        state.card = {
            activePlayer: activePlayer,
            targetPlayer: targetPlayer,
            text: formattedQ,
            approved: false
        };

        saveAndBroadcast(state);
    }

    function approveTask() {
        let state = loadState();
        if (!state.card) return;

        const activePlayer = state.card.activePlayer;
        if (state.players[activePlayer]) {
            state.players[activePlayer].score = (state.players[activePlayer].score || 0) + 1;
        }
        state.card.approved = true;

        saveAndBroadcast(state);
        alert(`כל הכבוד! ${activePlayer} קיבל/ה נקודה! 🏆`);
    }

    // רענון תקופתי קצר לסנכרון מיטבי בין מכשירים שונים
    setInterval(() => {
        if (roomCode) {
            let state = loadState();
            updateUILocally(state);
        }
    }, 1000);
</script>
</body>
</html>
