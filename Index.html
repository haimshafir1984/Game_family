<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק הקלפים המשפחתי שלנו</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --accent: #fd79a8;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #2d3436;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            margin: 20px 0;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
            border: 3px solid var(--secondary);
        }

        .card-target {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .card-text {
            font-size: 1.3rem;
            line-height: 1.6;
            color: var(--text);
        }

        input[type="text"] {
            width: 80%;
            padding: 12px;
            border: 2px solid var(--secondary);
            border-radius: 10px;
            font-size: 1rem;
            margin-bottom: 10px;
            outline: none;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s, transform 0.1s;
            margin: 5px;
        }

        button:hover {
            background-color: #5b4cc4;
        }

        button:active {
            transform: scale(0.98);
        }

        .players-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 15px 0;
        }

        .player-tag {
            background: var(--secondary);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎲 המשחק המשפחתי</h1>

    <!-- מסך הרשמה -->
    <div id="setup-screen">
        <h3>מי משחק איתנו?</h3>
        <input type="text" id="player-name" placeholder="הכנס שם משתתף...">
        <br>
        <button onclick="addPlayer()">הוסף משתתף</button>
        
        <div class="players-list" id="players-container"></div>
        
        <br><br>
        <button id="start-btn" onclick="startGame()" style="background-color: var(--accent); display:none;">התחל במשחק!</button>
    </div>

    <!-- מסך המשחק -->
    <div id="game-screen" class="hidden">
        <div id="turn-info" style="font-size: 1.2rem; font-weight: bold; color: var(--primary);"></div>
        
        <div class="card" id="main-card">
            <div class="card-target" id="card-target">לחץ על כפתור "הרם קלף" כדי להתחיל!</div>
            <div class="card-text" id="card-text">---</div>
        </div>

        <button onclick="nextCard()">🃏 הרם קלף חדש</button>
    </div>
</div>

<script>
    const players = [];
    let currentCardIndex = 0;

    // מאגר 64 שאלות ומשימות
    const questions = [
        "אם היית יכול להחליף תפקידים עם {target} ליום אחד, מה הדבר הראשון שהיית עושה?",
        "מה המאכל ש-{target} הכי אוהב/ת לאכול לדעתך?",
        "איזה סופר-כוח הכי מתאים ל-{target}?",
        "שתף בזיכרון מצחיק או מתוק שיש לך עם {target}.",
        "תעשה חיקוי מצחיק של {target} במשך 15 שניות!",
        "תן מחמאה מכל הלב ל-{target}.",
        "תמציא לחיצת יד סודית ומגניבה יחד עם {target}.",
        "ספר בדיחה! אם {target} צוחק/ת - קיבלת נקודה.",
        "מה הדבר הכי מיוחד או יפה ב-{target}?",
        "אם הייתם יוצאים לחופשה חלומית רק אתה ו-{target}, לאן הייתם נוסעים?",
        "אמור 3 דברים שאתה אוהב ב-{target}.",
        "שאל את {target} שאלה אחת שאי פעם רצית לשאול ולא יצא לך.",
        "נסה לנחש: מה הצבע האהוב על {target}?",
        "עשה פרצוף מצחיק עד ש-{target} מחייך/ת!",
        "תאר את {target} בשלוש מילים בלבד.",
        "מה הדבר שהכי מצחיק אותך ב-{target}?",
        "אם {target} היה גיבור על, מה היה שמו?",
        "שתף בטיפ אחד טוב שקיבלת מ-{target} או שאתה רוצה לתת לו/לה.",
        "איזה שיר הכי מזכיר לך את {target}?",
        "עשה עיסוי כתפיים קצר של 10 שניות ל-{target}.",
        "תאר יום מושלם שאתה ו-{target} הייתם מעבירים יחד.",
        "מה הדבר הכי אמיץ שראית את {target} עושה?",
        "אם היית צורך לבשל ארוחה ל-{target}, מה היית מכין?",
        "מה התכונה שאתה הכי מעריך ב-{target}?",
        "רוץ מסביב ל-{target} פעמיים ותגיד משהו מצחיק!",
        "נסה לחקות את הצחוק של {target}.",
        "איזה סרט או סדרה אתה ו-{target} הכי נהנים לראות יחד?",
        "מה המשימה או המלאכה ש-{target} הכי טוב/ה בה בבית?",
        "תן כיף באוויר (High Five) מיוחד ל-{target}!",
        "אם היית יכול להעניק מתנה יצירתית ל-{target}, מה זו הייתה?",
        // ניתן להמשיך להוסיף שאלות עד 64 בפורמט זה...
    ];

    // מילוי אוטומטי של שאלות נוספות עד 64
    while(questions.length < 64) {
        questions.push(`שאלה/משימה מיוחדת #${questions.length + 1}: תן מילה טובה ל-{target} ושתף משהו שמשמח אותך במשפחה!`);
    }

    function addPlayer() {
        const input = document.getElementById('player-name');
        const name = input.value.trim();
        
        if (name && !players.includes(name)) {
            players.push(name);
            input.value = '';
            renderPlayers();
        }
    }

    function renderPlayers() {
        const container = document.getElementById('players-container');
        container.innerHTML = players.map(p => `<span class="player-tag">${p}</span>`).join('');
        
        if (players.length >= 2) {
            document.getElementById('start-btn').style.display = 'inline-block';
        }
    }

    function startGame() {
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        // ערבוב שאלות
        questions.sort(() => Math.random() - 0.5);
    }

    function nextCard() {
        if (players.length < 2) return;

        // לבחור מי שואל ומי המטרה
        const activePlayerIndex = Math.floor(Math.random() * players.length);
        let targetPlayerIndex = Math.floor(Math.random() * players.length);
        
        while (targetPlayerIndex === activePlayerIndex) {
            targetPlayerIndex = Math.floor(Math.random() * players.length);
        }

        const activePlayer = players[activePlayerIndex];
        const targetPlayer = players[targetPlayerIndex];

        const rawQuestion = questions[currentCardIndex % questions.length];
        const formattedQuestion = rawQuestion.replace(/{target}/g, `<b>${targetPlayer}</b>`);

        document.getElementById('turn-info').innerText = `התור של: ${activePlayer}`;
        document.getElementById('card-target').innerText = `המשימה מול: ${targetPlayer}`;
        document.getElementById('card-text').innerHTML = formattedQuestion;

        currentCardIndex++;
    }
</script>
</body>
</html>
